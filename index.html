<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0c">
    <meta name="description" content="匡子洋 · 南方医科大学儿科学准大一新生、阿里达摩院AI高级训练师认证 | 个人简历与作品集主页" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>匡子洋 · 个人简历与作品集</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230c0c0c'/><text x='50' y='71' font-size='62' text-anchor='middle' fill='%2338BDF8' font-family='Inter,Arial,sans-serif' font-weight='700'>K</text></svg>" />

    <link href="assets/fonts/fonts.css" rel="stylesheet" />
    <link href="assets/remixicon/remixicon.css" rel="stylesheet" />
    <link href="assets/accordion.css" rel="stylesheet" />

    <style id="app-style">
        /* ==========================================================================
           设计系统：暗色编辑风 · 单一强调色 #38BDF8
           Shape Consistency Lock（文档化规则）：卡片/面板 = 14px，按钮/胶囊/标签 = 全圆 999px
           间距刻度：8px 基准（s1=8 s2=16 s3=24 s4=40 s5=64 s6=96 s7=128）
           ========================================================================== */
        :root {
            /* 强调色：全站唯一，任何区块都不得出现第二种强调色 */
            --accent: #38BDF8;
            --accent-soft: rgba(56, 189, 248, .18);
            --accent-line: rgba(56, 189, 248, .48);
            --accent-dim: rgba(56, 189, 248, .72);

            /* 中性色阶：冷灰，与强调色同源（不混入暖灰）
               亮度档整体上调：底色提亮、描边与浅层面片提高不透明度，
               使画面更通透，并与光标流体（#38BDF8）的辉光相呼应 */
            --bg: #10151E;
            --bg-soft: #161C27;
            --surface: rgba(255, 255, 255, .045);
            --surface-hi: rgba(255, 255, 255, .085);
            --line: rgba(255, 255, 255, .14);
            --line-hi: rgba(255, 255, 255, .28);
            /* 文字色同步提亮，抵消背景变亮带来的对比度损失（实测见下） */
            --ink: #EDF1F6;
            --ink-soft: #C6CEDA;
            --ink-faint: #A7B2C0;

            /* 字体：西文 Space Grotesk / Archivo Black，中文回退到系统字体 */
            --font-sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-display: "Archivo Black", "Space Grotesk", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-serif: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;

            /* 圆角体系 */
            --r-card: 14px;
            --r-pill: 999px;

            /* 间距刻度 */
            --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 64px; --s6: 96px; --s7: 128px;

            --max-width: 1080px;
            --measure: 64ch;
            --nav-h: 64px;
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            /* 极轻的文字投影：为「文字直接压在背景视频上」提供可读性兜底，
               即使视频出现高光帧也能保持清晰，且不会让画面变暗 */
            text-shadow: 0 1px 12px rgba(6, 9, 14, .5);
        }

        /* 装饰性底色：极轻的顶部光晕，避免纯黑死板（非十字网格线） */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            /* 环境光晕：范围更大、亮度更高（.07 → .18），与光标辉光同色同调 */
            background: radial-gradient(132% 82% at 50% -8%, rgba(56, 189, 248, .18), transparent 64%);
        }

        img { max-width: 100%; display: block; }
        a { color: inherit; }

        ::selection { background: var(--accent); color: #04121A; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* ===================== 背景视频层 ===================== */
        .bg-stage { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        /* 背景视频：不透明度 .55 → .75，并提亮一档，让画面更通透 */
        .bg-stage video {
            width: 100%; height: 100%; object-fit: cover;
            opacity: .75;
            filter: contrast(1.02) saturate(1.12) brightness(1.08);
        }
        /* 暗色遮罩：全面降低不透明度（.72/.82/.94 → .52/.64/.82）。
           实测正文对比度：视频常态亮度下约 11:1，远高于 WCAG AA 的 4.5:1 */
        .bg-stage::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(10, 12, 16, .68) 0%, rgba(10, 12, 16, .80) 45%, rgba(10, 12, 16, .90) 100%);
        }

        /* ===================== 入场 / 滚动揭示 ===================== */
        .js .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s cubic-bezier(.22, .9, .35, 1); }
        .js .reveal.in { opacity: 1; transform: none; }

        /* ===================== 封面首屏 ===================== */
        .cover {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: var(--s5) var(--s3);
        }
        .cover__inner { width: 100%; max-width: 1280px; }
        /* 封面箴言：由 StrokeText（React Bits 移植）逐字描边绘入，
           先以青蓝描出轮廓、再以近白填充。视觉由内部 SVG 提供，故此处的「字号」由
           容器宽度经 clamp() 响应式控制：桌面大、移动端不溢出也不折行（SVG 单行缩放）。 */
        .cover__motto {
            width: 100%;
            margin: 0 auto;
            /* 首屏标题拆两行上下错落：以全角逗号「，」为界，后半句右移 0.78em、下移 1.12em 形成阶梯；容器 100% 确定宽度使 SVG 随容器缩放；
               上限 480px（两行各四字）故整体比单行 1440 收紧一档，字号更克制；移动端由 ≤760px 媒体查询收敛到装订线内 */
            max-width: clamp(320px, 84vw, 480px);
        }
        /* StrokeText 基础样式（移植自 React Bits） */
        .stroke-text {
            display: block;
            width: 100%;
            line-height: 0;
        }
        .stroke-text__svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }
        .stroke-text__stroke,
        .stroke-text__fill {
            user-select: none;
        }
        .stroke-text__stroke {
            filter: drop-shadow(0 0 18px rgba(56, 189, 248, .28));
        }
        .cover__rule {
            width: 64px;
            height: 1px;
            margin: var(--s5) auto var(--s4);
            background: var(--accent-line);
            box-shadow: 0 0 14px rgba(56, 189, 248, .45);
        }
        .cover__name {
            margin: 0;
            margin-top: var(--s4);
            font-size: .95rem;
            letter-spacing: .42em;
            text-indent: .42em;
            color: var(--ink-faint);
            text-transform: none;
        }
        /* 封面入场（分层渐显）：标题容器先浮现，描边动画随后逐字绘入；
           分隔线与姓名在标题绘入中段依次跟进，形成层次。缓动改用更有张力的曲线。
           reduced-motion 下由媒体查询强制 opacity:1 / transform:none，保持可读。 */
        .js .cover__motto,
        .js .cover__rule,
        .js .cover__name { opacity: 0; transform: translateY(22px); }
        .js .cover__motto { transition: opacity 1.2s ease .1s, transform 1.2s cubic-bezier(.16, .84, .3, 1) .1s; }
        .js .cover__rule  { transition: opacity 1s ease .95s, transform 1s cubic-bezier(.16, .84, .3, 1) .95s; }
        .js .cover__name  { transition: opacity 1s ease 1.2s, transform 1s cubic-bezier(.16, .84, .3, 1) 1.2s; }
        .js .cover.is-ready .cover__motto,
        .js .cover.is-ready .cover__rule,
        .js .cover.is-ready .cover__name { opacity: 1; transform: none; }

        /* ===================== 导航 ===================== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            height: var(--nav-h);
            display: flex;
            align-items: center;
            /* 玻璃层更通透：不透明度 .72 → .60，并提亮、加强饱和 */
            background: rgba(16, 21, 30, .60);
            backdrop-filter: blur(16px) saturate(1.35) brightness(1.06);
            -webkit-backdrop-filter: blur(16px) saturate(1.35) brightness(1.06);
            border-bottom: 1px solid transparent;
            transition: opacity .45s ease, transform .45s ease, border-color .45s ease, background .45s ease;
            /* 封面之上默认隐藏，滚过封面后淡入（封面需要纯净） */
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }
        .navbar.is-visible {
            opacity: 1;
            transform: none;
            pointer-events: auto;
            border-bottom-color: var(--line);
        }
        .navbar-inner {
            max-width: var(--max-width);
            width: 100%;
            margin: 0 auto;
            padding: 0 var(--s3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--s2);
        }
        .navbar-brand {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: .04em;
            text-decoration: none;
            white-space: nowrap;
        }
        .navbar-brand small {
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: .68rem;
            letter-spacing: .12em;
            color: var(--ink-faint);
            margin-left: var(--s1);
        }
        .navbar-menu { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
        .navbar-links { display: flex; align-items: center; gap: 2px; }
        .nav-link {
            padding: 7px 13px;
            border-radius: var(--r-pill);
            font-size: .82rem;
            font-weight: 500;
            color: var(--ink-soft);
            text-decoration: none;
            white-space: nowrap;
            border: 1px solid transparent;
            transition: color .2s ease, background .2s ease, border-color .2s ease;
        }
        .nav-link:hover { color: var(--ink); background: var(--surface-hi); }
        .nav-link.active {
            color: var(--accent);
            background: var(--accent-soft);
            border-color: var(--accent-line);
            box-shadow: 0 0 18px rgba(56, 189, 248, .26);
        }
        .navbar-actions { display: flex; align-items: center; gap: var(--s1); flex-shrink: 0; }
        .btn-pill {
            padding: 8px 18px;
            border-radius: var(--r-pill);
            border: 1px solid var(--line-hi);
            background: var(--surface);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background .2s ease, border-color .2s ease, color .2s ease;
        }
        .btn-pill:hover { background: var(--surface-hi); border-color: var(--accent-line); color: var(--accent); }
        .nav-toggle { display: none; }

        /* ===================== 容器与区块 ===================== */
        main { position: relative; z-index: 2; }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--s3); }
        .section { padding-top: var(--s6); padding-bottom: var(--s6); position: relative; }
        /* 封面之后的第一个板块加大顶部留白（不能用 :first-of-type，首个 section 是封面） */
        .cover + .section { padding-top: var(--s7); }

        .sec-head { margin-bottom: var(--s5); }
        .sec-label {
            display: flex;
            align-items: baseline;
            gap: var(--s2);
            margin-bottom: var(--s3);
        }
        .sec-label h2 {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 3.4vw, 2.1rem);
            letter-spacing: .01em;
            margin: 0;
            line-height: 1.2;
        }
        .sec-label .sec-en {
            font-size: .72rem;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }
        .sec-rule { height: 1px; background: var(--line); margin-bottom: var(--s4); }

        .lede { max-width: var(--measure); color: var(--ink-soft); font-size: 1.02rem; margin: 0 0 var(--s4); }

        /* ===================== 关于 ===================== */
        .about-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--s6); align-items: start; }
        .about-body p { margin: 0 0 var(--s3); max-width: var(--measure); color: var(--ink-soft); }
        .tag-row { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s4); }
        .tag {
            padding: 5px 14px;
            border-radius: var(--r-pill);
            border: 1px solid var(--line);
            background: var(--surface);
            font-size: .78rem;
            color: var(--ink-soft);
        }
        .meta-list { display: grid; gap: var(--s2); }
        .meta-item { display: flex; flex-direction: column; gap: 2px; }
        .meta-item .k { font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); }
        .meta-item .v { font-size: .94rem; color: var(--ink); }
        .meta-item a.v { text-decoration: none; border-bottom: 1px solid var(--line-hi); padding-bottom: 1px; transition: color .2s ease, border-color .2s ease; }
        .meta-item a.v:hover { color: var(--accent); border-color: var(--accent-line); }
        .copy-email { cursor: pointer; }

        /* ===================== 成果数据 ===================== */
        .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); }
        .stat {
            padding: var(--s3) 0 0;
            border-top: 1px solid var(--line-hi);
        }
        .stat .num {
            font-family: var(--font-display);
            font-size: clamp(1.4rem, 3vw, 2rem);
            line-height: 1.15;
            color: var(--accent);
            letter-spacing: -.01em;
        }
        .stat .lbl { margin-top: var(--s1); font-size: .84rem; color: var(--ink-faint); line-height: 1.55; }

        /* ===================== 引导线时间轴 ===================== */
        .tl { position: relative; }
        .tl-item {
            position: relative;
            padding: 0 0 var(--s5) var(--s5);
        }
        .tl-item:last-child { padding-bottom: 0; }
        /* 连接线：每一段随该条目进入视口时自上而下绘出 */
        .tl-item .tl-line,
        .tl-item .tl-node { position: absolute; left: 5px; }
        .tl-item .tl-line {
            top: 14px;
            bottom: calc(-1 * var(--s5) + 14px);
            width: 1px;
            background: var(--line-hi);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform .8s cubic-bezier(.22, .9, .35, 1);
        }
        .tl-item:last-child .tl-line { display: none; }
        .tl-item.in .tl-line { transform: scaleY(1); }
        .tl-item .tl-node {
            top: 6px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--line-hi);
            transition: border-color .5s ease .25s, box-shadow .5s ease .25s;
        }
        /* 时间轴节点点亮时辉光范围更大更亮，与光标光晕呼应 */
        .tl-item.in .tl-node {
            border-color: var(--accent);
            box-shadow: 0 0 0 5px var(--accent-soft), 0 0 20px rgba(56, 189, 248, .42);
        }

        .tl-time {
            font-size: .74rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--accent-dim);
            margin-bottom: var(--s1);
        }
        .tl-title { font-size: 1.12rem; font-weight: 600; margin: 0 0 4px; letter-spacing: .01em; }
        .tl-sub { font-size: .88rem; color: var(--ink-faint); margin: 0 0 var(--s2); letter-spacing: .04em; }
        .tl-body { max-width: var(--measure); }
        .tl-body ul { margin: 0; padding-left: 1.15em; color: var(--ink-soft); }
        .tl-body li { margin-bottom: var(--s1); font-size: .95rem; }
        .tl-body strong { color: var(--ink); font-weight: 600; }
        .tl-body p { margin: 0; color: var(--ink-soft); font-size: .95rem; }

        /* ===================== 能力（无填充轨道进度条） ===================== */
        .skills-groups { display: grid; gap: var(--s5); }
        .skill-group h3 {
            font-size: .74rem;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--ink-faint);
            margin: 0 0 var(--s3);
            font-weight: 600;
        }
        .skill-rows { display: grid; gap: var(--s3); }
        .skill {
            display: grid;
            grid-template-columns: 132px minmax(0, 1fr) 92px;
            gap: var(--s2);
            align-items: baseline;
        }
        .skill__name { font-size: .95rem; font-weight: 600; }
        .skill__desc { font-size: .88rem; color: var(--ink-soft); margin: 0; }
        /* 细内联刻度线：无背景轨道（符合排版规范），仅作长度编码 */
        .skill__meter {
            margin-top: 7px;
            height: 1px;
            background: var(--accent);
            width: 0;
            /* 刻度线自带柔光，与鼠标光效同色 */
            box-shadow: 0 0 10px rgba(56, 189, 248, .55);
            transition: width .9s cubic-bezier(.22, .9, .35, 1);
        }
        /* 熟练度：中文备注 + 数值，与打印版口径一致 */
        .skill__lvl {
            display: flex;
            justify-content: flex-end;
            align-items: baseline;
            gap: 8px;
            text-align: right;
        }
        .skill__lvl-txt { font-size: .84rem; color: var(--ink-soft); }
        .skill__lvl-num { font-size: .76rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

        /* ===================== 作品 ===================== */
        .portfolio-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
        .work {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-card);
            overflow: hidden;
            text-decoration: none;
            transition: border-color .28s ease, background .28s ease, transform .28s ease;
        }
        .work:hover {
            border-color: var(--accent-line);
            background: var(--surface-hi);
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(56, 189, 248, .16);
        }
        .work__thumb { aspect-ratio: 16 / 10; overflow: hidden; background: var(--bg-soft); }
        .work__thumb img { width: 100%; height: 100%; object-fit: cover; }
        .work__thumb--blank {
            display: grid;
            place-items: center;
            font-family: var(--font-display);
            font-size: 2rem;
            color: rgba(255, 255, 255, .10);
        }
        .work__body { padding: var(--s3); display: flex; flex-direction: column; gap: var(--s1); flex: 1; }
        .work__tag { font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent-dim); }
        .work__title { font-size: 1.02rem; font-weight: 600; margin: 0; }
        .work__desc { font-size: .87rem; color: var(--ink-soft); margin: 0; flex: 1; }
        .work__cta { font-size: .8rem; color: var(--accent); margin-top: var(--s1); }

        /* ===================== 证书画廊 ===================== */
        .cert-block { margin-top: var(--s6); }
        .cert-block h3 {
            font-size: .74rem;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--ink-faint);
            margin: 0 0 var(--s3);
            font-weight: 600;
        }
        .cert-list { display: grid; gap: var(--s2); margin-bottom: var(--s4); }
        .cert-row {
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr);
            gap: var(--s2);
            padding-bottom: var(--s2);
            border-bottom: 1px solid var(--line);
            font-size: .92rem;
        }
        .cert-row:last-child { border-bottom: none; }
        .cert-row .y { color: var(--accent-dim); font-size: .82rem; font-variant-numeric: tabular-nums; }
        .cert-row .t { color: var(--ink); }
        .cert-row .d { color: var(--ink-faint); font-size: .84rem; }

        /* ===================== 联系 ===================== */
        .contact-grid { display: grid; gap: var(--s3); max-width: 620px; }
        .contact-line { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
        .contact-line .k {
            font-size: .7rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--ink-faint);
            min-width: 72px;
        }
        .contact-line .v { font-size: 1rem; }
        .contact-line a.v { text-decoration: none; border-bottom: 1px solid var(--line-hi); transition: color .2s ease, border-color .2s ease; }

                firstRun = false;

                function setActive(i) {
                    i = Math.max(0, Math.min(count - 1, i));
                    if (i === active) return;
                    active = i;
                    panelRefs.forEach((p, k) => {
                        p.classList.toggle('ag-panel--active', k === active);
                        p.setAttribute('aria-current', k === active ? 'true' : 'undefined');
                    });
                    applyLayout(true);
                }

                panelRefs.forEach((panel, i) => {
                    if (o.trigger === 'hover') {
                        panel.addEventListener('mouseenter', () => setActive(i));
                    }
                    panel.addEventListener('focus', () => setActive(i));
                    panel.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); setActive((i + 1) % count); }
                        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); setActive((i - 1 + count) % count); }
                    });
                    panel.addEventListener('click', (e) => {
                        const item = items[i];
                        // 触屏模式：首次点击展开面板（触发动画），再次点击已展开面板才打开大图
                        if (o.trigger !== 'hover' && i !== active) { setActive(i); return; }
                        if (modal && modalImg && item && item.image) {
                            e.preventDefault();
                            modalImg.src = item.image;
                            modal.classList.add('active');
                        }
                    });
                });

                // 移动端：进入视口时自动轮播一轮展开动画（仅一次），让动画可见；用户手动交互后停止
                if (isTouch && hasGSAP && !prefersReduced) {
                    let autoStopped = false;
                    const playOnce = () => {
                        if (autoStopped) return;
                        const order = [];
                        for (let k = 1; k <= count; k++) order.push((active + k) % count);
                        let seq = 0;
                        const step = () => {
                            if (autoStopped) return;
                            setActive(order[seq % count]);
                            seq++;
                            if (seq < order.length) setTimeout(step, 560);
                        };
                        setTimeout(step, 400);
                    };
                    if ('IntersectionObserver' in window) {
                        const io = new IntersectionObserver((ents) => {
                            ents.forEach(en => { if (en.isIntersecting) { playOnce(); io.disconnect(); } });
                        }, { threshold: 0.35 });
                        io.observe(root);
                    } else {
                        playOnce();
                    }
                    const stop = () => { autoStopped = true; };
                    root.addEventListener('pointerdown', stop, { once: true });
                    root.addEventListener('touchstart', stop, { once: true });
                }

            // 顺序与 DOM 一致；封面不参与导航高亮
            const ids = ['about','stats','experience','education','skills','portfolio','contact'];
            const setNavActive = (id) => {
                navLinks.forEach(l => {

            // 点击/平滑滚动过渡期间锁定，避免 scroll-spy 覆盖用户所选，导致发光错位
            let navLockUntil = 0;

            const spyNav = () => {
                if (Date.now() < navLockUntil) return;
                const line = window.scrollY + 80; // 固定导航栏高度偏移
                let current = ''; // 停留在封面时不高亮任何导航项
                for (const id of ids) {
                    const el = document.getElementById(id);
                    if (el && (el.getBoundingClientRect().top + window.scrollY) <= line) current = id;
                }
                setNavActive(current);
            };
            window.addEventListener('scroll', spyNav, { passive: true });
            window.addEventListener('resize', spyNav);
            spyNav();
            // 滚动真正停止后（含 smooth 结束）再校准一次，覆盖锁定残留
            window.addEventListener('scrollend', () => { navLockUntil = 0; spyNav(); });

            // 锚点平滑滚动（JS 接管，消除 file:// 下锚点导航的浏览器安全警告，并适配固定导航高度）
            $$('a[href^="#"]').forEach(a => {
                a.addEventListener('click', (e) => {
                    const id = a.getAttribute('href').slice(1);
                    if (!id) { e.preventDefault(); return; } // 占位链接（href="#"）不跳转
                    const el = document.getElementById(id);
                    if (el) {
                        e.preventDefault();
                        // 主导航项：立即把发光高亮到被点项，并锁定到滚动结束，保证视觉与目标一致
                        if (a.closest('.navbar-links')) {
                            setNavActive(id);
                            navLockUntil = Date.now() + 1200;
                        }
                        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        try { history.replaceState(null, '', '#' + id); } catch (_) {}
                    }
                });

            // 移动端收纳菜单：点击汉堡按钮展开/收起全部导航
            const navToggle = $('#navToggle');
            const navbarEl = $('#navbar');
            const navMenu = $('#navMenu');
            if (navToggle && navbarEl && navMenu) {
                const setNavOpen = (open) => {
                    navbarEl.classList.toggle('menu-open', open);
                    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                    const ic = navToggle.querySelector('i');
                    if (ic) ic.className = open ? 'ri-close-line' : 'ri-menu-line';
                };
                navToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setNavOpen(!navbarEl.classList.contains('menu-open'));
                });
                $$('#navMenu a').forEach(a => a.addEventListener('click', () => setNavOpen(false)));
                const pb = navMenu.querySelector('.print-btn');
                if (pb) pb.addEventListener('click', () => setNavOpen(false));
                document.addEventListener('click', (e) => {
                    if (navbarEl.classList.contains('menu-open') && !navbarEl.contains(e.target)) setNavOpen(false);
                });
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setNavOpen(false); });

            // 封面：入场动画（分段上浮），并控制导航栏在滚过封面后才淡入
            const coverEl = $('#cover');
            if (coverEl) {
                // 背景就绪后再淡入封面：等背景视频可播放（或兜底超时），确保标题动画播放时背景已就位
                const bgReady = window.__bgReady || Promise.resolve();
                bgReady.then(() => {
                    requestAnimationFrame(() => requestAnimationFrame(() => coverEl.classList.add('is-ready')));
                });
                if ('IntersectionObserver' in window && navbarEl) {
                    const navObs = new IntersectionObserver(es => {
                        // 封面离开视口即显示导航；回到封面则隐藏，保证封面纯净
                        const leaving = !es[0].isIntersecting;
                        navbarEl.classList.toggle('is-visible', leaving);
                    }, { threshold: 0.25 });
                    navObs.observe(coverEl);
                } else if (navbarEl) {
                    navbarEl.classList.add('is-visible');
                }
            }

            // 滚动揭示：板块淡入上移；时间轴条目逐项绘出引导线；能力刻度线同时展开
            const revEls = $$('.reveal');
            const tlItems = $$('.tl-item');
            const meters = $$('.skill__meter');
            const paintMeters = (el) => {
                meters.forEach(m => { if (el.contains(m)) m.style.width = (m.getAttribute('data-level') || 0) + '%'; });
            };
            if ('IntersectionObserver' in window) {
                const revObs = new IntersectionObserver(es => {
                    es.forEach(e => {
                        e.target.classList.toggle('in', e.isIntersecting);
                        if (e.isIntersecting) paintMeters(e.target);
                    });
                }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
                revEls.forEach(el => revObs.observe(el));
                if (tlItems.length) {
                    const tlObs = new IntersectionObserver(es => {
                        es.forEach(e => e.target.classList.toggle('in', e.isIntersecting));
                    }, { threshold: 0.3, rootMargin: '0px 0px -10% 0px' });
                    tlItems.forEach(el => tlObs.observe(el));
                }
            } else {
                revEls.forEach(el => { el.classList.add('in'); paintMeters(el); });
                tlItems.forEach(el => el.classList.add('in'));
            }

            // 打印简历（导航与联系区块各一个入口）
            const printBtns = [$('#printBtn'), $('#contactPrint')].filter(Boolean);
            printBtns.forEach(b => b.addEventListener('click', () => window.print()));

            // 返回顶部
            const bt = $('#backTop');
            window.addEventListener('scroll', () => { bt.classList.toggle('visible', window.scrollY > 400); });
            bt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            // 页面固定为单一暗色主题（Page Theme Lock：全站不中途切换明暗）

            // 暴露给全局（兼容任何旧内联 onclick 引用）
            window.copyEmail = copyEmail;
        });
    </script>

    <!-- 背景就绪门控：标题与封面入场动画需等背景视频可播放（或兜底超时）后才启动，
         避免标题在背景仍在缓冲时先播放；视频加载失败时由 .bg-stage::after 暗色渐变兜底。
         该 Promise 在解析期即定义，供下方 StrokeText 脚本与主脚本共同读取。 -->
    <script>
    (function () {
      window.__bgReady = new Promise(function (resolve) {
        var vid = document.querySelector('.bg-stage video');
        if (!vid) { resolve(); return; }
        if (vid.readyState >= 2) { resolve(); return; } // 已有首帧 / 可播放
        var done = false;
        var finish = function () { if (!done) { done = true; resolve(); } };
        vid.addEventListener('loadeddata', finish, { once: true });
        vid.addEventListener('canplay', finish, { once: true });
        vid.addEventListener('error', finish, { once: true });
        setTimeout(finish, 1600); // 兜底：视频过慢也不阻塞标题动画
      });
    })();
    </script>

    <!-- ===== 封面箴言 StrokeText（React Bits 移植为原生 JS，依赖站点内的 gsap） ===== -->
    <script>
    (function () {
      const root = document.getElementById('strokeMotto');
      if (!root) return;
      const NS = 'http://www.w3.org/2000/svg';
      const gsap = window.gsap;
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const text = (root.getAttribute('data-text') || root.textContent || 'Draw Attention').trim();
      const strokeColor = root.getAttribute('data-stroke') || '#38BDF8';
      const fillColor = root.getAttribute('data-fill') || '#F4F7FA';
      const fontSize = parseFloat(root.getAttribute('data-fontsize') || '120');
      const fontWeight = root.getAttribute('data-weight') || '500';
      const letterSpacing = parseFloat(root.getAttribute('data-spacing') || '0');
      const strokeWidth = parseFloat(root.getAttribute('data-strokewidth') || '2.4');
      const drawDuration = parseFloat(root.getAttribute('data-draw') || '1.6');
      const fillDelay = parseFloat(root.getAttribute('data-filldelay') || '0.2');
      const stagger = parseFloat(root.getAttribute('data-stagger') || '0.08');
      const ease = root.getAttribute('data-ease') || 'power2.out';
      const fillMode = root.getAttribute('data-fillmode') || 'wipe';
      const reverse = root.getAttribute('data-reverse') === 'true';
      const startDelay = parseFloat(root.getAttribute('data-delay') || '0');

      // 前后半句上下错落：以全角逗号「，」为界拆成两行，第二行右移 indent、下移 lineGap 形成阶梯；无逗号则保持单行（向下兼容）
      const lineGap = fontSize * 1.12;
      const indent = fontSize * 0.78;
      const segments = text.split('，');
      const flatChars = [];
      segments.forEach(function (seg, li) {
        Array.from(seg).forEach(function (ch, ci) { flatChars.push({ ch: ch, li: li, first: ci === 0 }); });
      });
      const dash = Math.max(fontSize * 7, 200);
      const fallbackFont = '"Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif';
      const fsStack = (getComputedStyle(root).getPropertyValue('--font-serif') || '').trim() || fallbackFont;

      const span = document.createElement('span');
      span.className = 'stroke-text';
      span.setAttribute('role', 'img');
      span.setAttribute('aria-label', text);

      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'stroke-text__svg');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      svg.setAttribute('aria-hidden', 'true');

      let wipeRect = null;
      if (fillMode === 'wipe') {
        const defs = document.createElementNS(NS, 'defs');
        const clip = document.createElementNS(NS, 'clipPath');
        clip.setAttribute('id', 'strokeMottoWipe');
        clip.setAttribute('clipPathUnits', 'userSpaceOnUse');
        wipeRect = document.createElementNS(NS, 'rect');
        wipeRect.setAttribute('x', '0');
        wipeRect.setAttribute('y', '0');
        wipeRect.setAttribute('width', '0');
        wipeRect.setAttribute('height', '200');
        clip.appendChild(wipeRect);
        defs.appendChild(clip);
        svg.appendChild(defs);
      }

      const fontStyle = 'font-family: ' + fsStack +
        '; font-size: ' + fontSize + 'px; font-weight: ' + fontWeight + '; letter-spacing: ' + letterSpacing + 'px;';

      const strokeText = document.createElementNS(NS, 'text');
      strokeText.setAttribute('class', 'stroke-text__stroke');
      strokeText.setAttribute('x', '0');
      strokeText.setAttribute('y', '0');
      strokeText.setAttribute('fill', 'none');
      strokeText.setAttribute('stroke', strokeColor);
      strokeText.setAttribute('stroke-width', strokeWidth);
      strokeText.setAttribute('stroke-linejoin', 'round');
      strokeText.setAttribute('stroke-linecap', 'round');
      strokeText.setAttribute('style', fontStyle);

      const fillText = document.createElementNS(NS, 'text');
      fillText.setAttribute('class', 'stroke-text__fill');
      fillText.setAttribute('x', '0');
      fillText.setAttribute('y', '0');
      fillText.setAttribute('fill', fillColor);
      fillText.setAttribute('stroke', 'none');
      fillText.setAttribute('style', fontStyle);
      if (fillMode === 'wipe' && wipeRect) fillText.setAttribute('clip-path', 'url(#strokeMottoWipe)');

      flatChars.forEach(function (item) {
        const s = document.createElementNS(NS, 'tspan');
        s.setAttribute('data-stroke-char', '');
        if (item.li > 0 && item.first) { s.setAttribute('x', indent); s.setAttribute('dy', lineGap); }
        s.textContent = item.ch;
        strokeText.appendChild(s);
        const f = document.createElementNS(NS, 'tspan');
        f.setAttribute('data-fill-char', '');
        if (item.li > 0 && item.first) { f.setAttribute('x', indent); f.setAttribute('dy', lineGap); }
        f.textContent = item.ch;
        fillText.appendChild(f);
      });

      svg.appendChild(strokeText);
      svg.appendChild(fillText);
      span.appendChild(svg);
      root.textContent = '';
      root.appendChild(span);

      const strokes = Array.from(span.querySelectorAll('[data-stroke-char]'));
      const fills = Array.from(span.querySelectorAll('[data-fill-char]'));

      // 无 gsap 或减少动效：直接呈现终态（已完整绘入），不做描边动画
      if (!gsap || prefersReduced) return;

      // 初始即隐藏描边，避免「先全显再重绘」的闪动
      gsap.set(strokes, { strokeDasharray: dash, strokeDashoffset: dash });
      if (fillMode !== 'none' && fillMode !== 'wipe') gsap.set(fills, { opacity: 0 });

      let box = null;
      const measure = function () {
        let bbox;
        try { bbox = strokeText.getBBox(); } catch (e) { return false; }
        if (!bbox || !bbox.width) return false;
        const pad = Math.max(strokeWidth, fontSize * 0.1);
        box = { x: bbox.x - pad, y: bbox.y - pad, width: bbox.width + pad * 2, height: bbox.height + pad * 2 };
        svg.setAttribute('viewBox', box.x + ' ' + box.y + ' ' + box.width + ' ' + box.height);
        if (wipeRect) {
          wipeRect.setAttribute('x', box.x);
          wipeRect.setAttribute('y', box.y);
          wipeRect.setAttribute('height', box.height);
        }
        return true;
      };

      const run = function () {
        if (!measure()) { requestAnimationFrame(run); return; }
        const useWipe = fillMode === 'wipe';
        const fillEnabled = fillMode !== 'none';
        const fillDuration = Math.max(0.4, drawDuration * 0.5);
        const staggerConfig = reverse ? { each: stagger, from: 'end' } : stagger;
        const targets = strokes.concat(fills);
        if (wipeRect) targets.push(wipeRect);

        const setStart = function () {
          gsap.killTweensOf(targets);
          gsap.set(strokes, { strokeDasharray: dash, strokeDashoffset: dash });
          gsap.set(fills, { opacity: useWipe ? 1 : 0 });
          if (wipeRect) wipeRect.setAttribute('width', '0');
        };
        setStart();

        const tl = gsap.timeline({ paused: true, defaults: { overwrite: 'auto' } });
        tl.to(strokes, { strokeDashoffset: 0, duration: drawDuration, ease: ease, stagger: staggerConfig }, 0);
        if (useWipe && wipeRect) {
          tl.to(wipeRect, { attr: { width: box.width }, duration: fillDuration, ease: 'power2.inOut' }, drawDuration + fillDelay);
        } else if (fillEnabled) {
          tl.to(fills, { opacity: 1, duration: fillDuration, ease: 'power2.out', stagger: staggerConfig }, drawDuration + fillDelay);
        }
        if (startDelay > 0) gsap.delayedCall(startDelay, function () { tl.play(0); });
        else tl.play(0);
      };

      // 背景就绪后再绘入标题：等字体就绪且背景视频可播放（或兜底超时），
      // 保证标题描边动画播放时背景已就位，不在黑屏/缓冲画面上绘制。
      const fontsReady = (document.fonts && document.fonts.ready)
        ? document.fonts.ready.catch(function () { return null; })
        : Promise.resolve();
      const bgReady = window.__bgReady || Promise.resolve();
      Promise.all([fontsReady, bgReady]).then(function () {
        if (!measure()) { requestAnimationFrame(function () { run(); }); return; }
        run();
      }).catch(function () { run(); });
    })();
    </script>

    <!-- ===== 移动端 StaggeredMenu（React Bits 移植为原生 JS，依赖已在站点内的 gsap） ===== -->

        // ---------- 开启时间线（错位层 → 面板 → 条目 → 序号 → 联系方式） ----------
        function buildOpenTimeline() {
            if (openTl) { openTl.kill(); openTl = null; }
            if (closeTween) { closeTween.kill(); closeTween = null; }
            const els = itemEls(), nums = numEls(), links = linkEls();
            gsap.set(els, { yPercent: 140, rotate: 10 });
            gsap.set(nums, { opacity: 0 });

            const tl = gsap.timeline({ paused: true });
            layerEls.forEach(function (ly, i) {

            const lastTime = layerEls.length ? (layerEls.length - 1) * 0.07 * ds : 0;
            const insertAt = lastTime + (layerEls.length ? 0.08 * ds : 0);
            const panelDur = 0.65 * ds;
            tl.fromTo(panel, { xPercent: offscreen }, { xPercent: 0, duration: panelDur, ease: 'power4.out' }, insertAt);

            if (els.length) {
                const itemsStart = insertAt + panelDur * 0.15;
                tl.to(els, { yPercent: 0, rotate: 0, duration: 1 * ds, ease: 'power4.out', stagger: { each: 0.1 * ds, from: 'start' } }, itemsStart);
                if (nums.length) {
                    tl.to(nums, { opacity: 1, duration: 0.6 * ds, ease: 'power2.out', stagger: { each: 0.08 * ds, from: 'start' } }, itemsStart + 0.1 * ds);
                }
            }
            const socialsStart = insertAt + panelDur * 0.4;
            tl.to(sTitle, { opacity: 1, duration: 0.5 * ds, ease: 'power2.out' }, socialsStart);
            if (links.length) {
                tl.to(links, { y: 0, opacity: 1, duration: 0.55 * ds, ease: 'power3.out', stagger: { each: 0.08 * ds, from: 'start' } }, socialsStart + 0.04 * ds);
            }
            openTl = tl;
            return tl;
        }

        function playOpen() {
            if (!hasGsap) { root.classList.add('is-open'); return; }
            if (busy) return;
            busy = true;
            // 安全网：即便 gsap 时间线因任何原因未生效，CSS 也能保证面板可见（不改配色）
            root.classList.add('is-open');
            const tl = buildOpenTimeline();
            if (tl) {
                tl.eventCallback('onComplete', function () {
                    busy = false;
                    /* 动画结束后清除内联 transform，改由 CSS is-open（!important）接管静止态，避免残留 */
                    gsap.set([panel].concat(layerEls), { clearProps: 'transform' });

            } else {
                busy = false; /* 时间线构建失败时保留 is-open，交由 CSS !important 兜底显示面板（不改配色） */

        function playClose() {
            root.classList.remove('is-open');

            if (openTl) { openTl.kill(); openTl = null; }

        function animateColor(opening) {
            if (!hasGsap) return;

        // 文字循环：菜单 / 关闭 交替滚动到位
        function animateText(opening) {
            if (!hasGsap) { setLines([opening ? CONFIG.labelOpen : CONFIG.labelClosed]); return; }
            if (textAnim) textAnim.kill();
            const cur = opening ? CONFIG.labelClosed : CONFIG.labelOpen;
            const tgt = opening ? CONFIG.labelOpen : CONFIG.labelClosed;
            const seq = [cur];
            let last = cur;
            for (let i = 0; i < 3; i++) {
                last = (last === CONFIG.labelClosed) ? CONFIG.labelOpen : CONFIG.labelClosed;
                seq.push(last);
            }
            if (last !== tgt) seq.push(tgt);
            seq.push(tgt);
            setLines(seq);
            gsap.set(textInner, { yPercent: 0 });
            const n = seq.length;
            textAnim = gsap.to(textInner, {
                yPercent: -(((n - 1) / n) * 100),
                duration: (0.5 + n * 0.07) * ds,
                ease: 'power4.out'
            });
        }

        function setOpenState(target) {
            open = target;
            toggleBtn.setAttribute('aria-expanded', target ? 'true' : 'false');
            toggleBtn.setAttribute('aria-label', target ? '关闭菜单' : '打开菜单');
            panel.setAttribute('aria-hidden', target ? 'false' : 'true');
        }

        function toggleMenu() {
            const target = !open;
            setOpenState(target);
            if (target) playOpen(); else playClose();
            animateIcon(target);
            animateColor(target);
            animateText(target);
        }

        function closeMenu() {
            if (!open) return;
            setOpenState(false);
            playClose();
            animateIcon(false);
            animateColor(false);
            animateText(false);
        }

        toggleBtn.addEventListener('click', toggleMenu);

        // 点击面板外或按 Esc 关闭
        function outsideClose(e) {
            if (!open) return;
            if (!panel.contains(e.target) && !toggleBtn.contains(e.target)) closeMenu();
        }
        document.addEventListener('mousedown', outsideClose);
        document.addEventListener('touchstart', outsideClose, { passive: true });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

        // 面板内的锚点：只负责收起面板。
        // 平滑滚动由主脚本的通用 a[href^="#"] 处理器接管（DOMContentLoaded 时会覆盖到这些链接），避免重复绑定。
        q('.sm-panel-item').forEach(function (a) {
            a.addEventListener('click', function () { closeMenu(); });
        });

        // 视口放大到桌面宽度时收起，避免与桌面端导航重复
        window.addEventListener('resize', function () {
            if (window.innerWidth > 760 && open) closeMenu();
        });
    })();

    <!-- ===== 光标流体拖尾 SplashCursor（React Bits 组件移植为原生 JS，无 React 依赖） ===== -->
    <script>
    (function () {
        'use strict';

        // 尊重系统"减少动态效果"偏好
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const canvas = document.getElementById('fluid');
        if (!canvas) return;

        // 配置：站点主色青蓝 #38BDF8；平衡档画质（DYE 1024 / SIM 128）
        const config = {
            SIM_RESOLUTION: 128,
            DYE_RESOLUTION: 1024,
            CAPTURE_RESOLUTION: 512,
            DENSITY_DISSIPATION: 3.5,
            VELOCITY_DISSIPATION: 2,
            PRESSURE: 0.1,
            PRESSURE_ITERATIONS: 20,
            CURL: 3,
            SPLAT_RADIUS: 0.2,
            SPLAT_FORCE: 6000,
            SHADING: true,
            COLOR_UPDATE_SPEED: 10,
            PAUSED: false,
            BACK_COLOR: { r: 0.5, g: 0, b: 0 },
            TRANSPARENT: true,
            RAINBOW_MODE: false,
            COLOR: '#38BDF8'
        };

        let animationFrameId = null;
        let isActive = true;

        function pointerPrototype() {
            this.id = -1;
            this.texcoordX = 0;
            this.texcoordY = 0;
            this.prevTexcoordX = 0;
            this.prevTexcoordY = 0;
            this.deltaX = 0;
            this.deltaY = 0;
            this.down = false;
            this.moved = false;
            this.color = [0, 0, 0];
        }

        const pointers = [new pointerPrototype()];

        // ---------- WebGL 上下文 ----------
        function getWebGLContext(canvas) {
            const params = {
                alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false
            };
            let gl = canvas.getContext('webgl2', params);
            const isWebGL2 = !!gl;
            if (!isWebGL2) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
            if (!gl) return null;

            let halfFloat;
            let supportLinearFiltering;
            if (isWebGL2) {
                gl.getExtension('EXT_color_buffer_float');
                supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
            } else {
                halfFloat = gl.getExtension('OES_texture_half_float');
                supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
            }
            gl.clearColor(0.0, 0.0, 0.0, 1.0);

            const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : (halfFloat && halfFloat.HALF_FLOAT_OES);
            let formatRGBA;
            let formatRG;
            let formatR;

            if (isWebGL2) {
                formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
                formatRG = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
                formatR = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
            } else {
                formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
                formatRG = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
                formatR = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
            }

            // 关键格式不可用则不启用特效，避免整站脚本报错
            if (!formatRGBA || !formatRG || !formatR) return null;

            return {
                gl,
                ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering }
            };
        }

        function getSupportedFormat(gl, internalFormat, format, type) {
            if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
                switch (internalFormat) {
                    case gl.R16F:
                        return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
                    case gl.RG16F:
                        return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
                    default:
                        return null;
                }
            }
            return { internalFormat, format };
        }

        function supportRenderTextureFormat(gl, internalFormat, format, type) {
            const texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
            const fbo = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
            const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
            return status === gl.FRAMEBUFFER_COMPLETE;
        }

        const context = getWebGLContext(canvas);
        if (!context) return; // 浏览器不支持 WebGL：静默降级，站点其余功能不受影响
        const gl = context.gl;
        const ext = context.ext;

        if (!ext.supportLinearFiltering) {
            config.DYE_RESOLUTION = 256;
            config.SHADING = false;
        }

        // ---------- 着色器封装 ----------
        class Material {
            constructor(vertexShader, fragmentShaderSource) {
                this.vertexShader = vertexShader;
                this.fragmentShaderSource = fragmentShaderSource;
                this.programs = [];
                this.activeProgram = null;
                this.uniforms = [];
            }
            setKeywords(keywords) {
                let hash = 0;
                for (let i = 0; i < keywords.length; i++) hash += hashCode(keywords[i]);
                let program = this.programs[hash];
                if (program == null) {
                    let fragmentShader = compileShader(gl.FRAGMENT_SHADER, this.fragmentShaderSource, keywords);
                    program = createProgram(this.vertexShader, fragmentShader);
                    this.programs[hash] = program;
                }
                if (program === this.activeProgram) return;
                this.uniforms = getUniforms(program);
                this.activeProgram = program;
            }
            bind() {
                gl.useProgram(this.activeProgram);
            }
        }

        class Program {
            constructor(vertexShader, fragmentShader) {
                this.uniforms = {};
                this.program = createProgram(vertexShader, fragmentShader);
                this.uniforms = getUniforms(this.program);
            }
            bind() {
                gl.useProgram(this.program);
            }
        }

        function createProgram(vertexShader, fragmentShader) {
            let program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.trace(gl.getProgramInfoLog(program));
            return program;
        }

        function getUniforms(program) {
            let uniforms = [];
            let uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
            for (let i = 0; i < uniformCount; i++) {
                let uniformName = gl.getActiveUniform(program, i).name;
                uniforms[uniformName] = gl.getUniformLocation(program, uniformName);
            }
            return uniforms;
        }

        function compileShader(type, source, keywords) {
            source = addKeywords(source, keywords);
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) console.trace(gl.getShaderInfoLog(shader));
            return shader;
        }

        function addKeywords(source, keywords) {
            if (!keywords) return source;
            let keywordsString = '';
            keywords.forEach(keyword => {
                keywordsString += '#define ' + keyword + '\n';
            });
            return keywordsString + source;
        }

        const baseVertexShader = compileShader(
            gl.VERTEX_SHADER,
            `
        precision highp float;
        attribute vec2 aPosition;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform vec2 texelSize;

        void main () {
            vUv = aPosition * 0.5 + 0.5;
            vL = vUv - vec2(texelSize.x, 0.0);
            vR = vUv + vec2(texelSize.x, 0.0);
            vT = vUv + vec2(0.0, texelSize.y);
            vB = vUv - vec2(0.0, texelSize.y);
            gl_Position = vec4(aPosition, 0.0, 1.0);
        }
      `
        );

        const copyShader = compileShader(
            gl.FRAGMENT_SHADER,
            `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        uniform sampler2D uTexture;

        void main () {
            gl_FragColor = texture2D(uTexture, vUv);
        }
      `
        );

        const clearShader = compileShader(
            gl.FRAGMENT_SHADER,
            `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        uniform sampler2D uTexture;
        uniform float value;

        void main () {
            gl_FragColor = value * texture2D(uTexture, vUv);
        }
      `
        );

        const displayShaderSource = `
      precision highp float;
      precision highp sampler2D;
      varying vec2 vUv;
      varying vec2 vL;
      varying vec2 vR;
      varying vec2 vT;
      varying vec2 vB;
      uniform sampler2D uTexture;
      uniform sampler2D uDithering;
      uniform vec2 ditherScale;
      uniform vec2 texelSize;

      vec3 linearToGamma (vec3 color) {
          color = max(color, vec3(0));
          return max(1.055 * pow(color, vec3(0.416666667)) - 0.055, vec3(0));
      }

      void main () {
          vec3 c = texture2D(uTexture, vUv).rgb;
          #ifdef SHADING
              vec3 lc = texture2D(uTexture, vL).rgb;
              vec3 rc = texture2D(uTexture, vR).rgb;
              vec3 tc = texture2D(uTexture, vT).rgb;
              vec3 bc = texture2D(uTexture, vB).rgb;

              float dx = length(rc) - length(lc);
              float dy = length(tc) - length(bc);

              vec3 n = normalize(vec3(dx, dy, length(texelSize)));
              vec3 l = vec3(0.0, 0.0, 1.0);

              float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);

          float a = max(c.r, max(c.g, c.b));
          gl_FragColor = vec4(c, a);
